<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#20160c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐐%3C/text%3E%3C/svg%3E">
<title>The Goat 🐐 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6c690;--ink:#3b2a1a;--panel:#fff6e0;--accent:#d9412b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#3d2f1f;--ink:#f6e7c8}}
:root[data-theme="dark"]{--panel:#3d2f1f;--ink:#f6e7c8}
html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
h1{font-family:'Lalezar','Cairo',sans-serif;font-size:2.6rem;margin:0;color:var(--accent);line-height:1}
#menu,#end{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:10px}
#end{align-items:center;background:rgba(0,0,0,.4)}
.card{touch-action:pan-y;background:var(--panel);border-radius:18px;padding:16px;max-width:560px;width:100%;max-height:58%;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#end .card{max-height:90%}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button{font:inherit;font-weight:700;border:3px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.on{background:var(--ink);color:var(--panel)}
button.go{background:var(--accent);color:#fff;border-color:var(--accent);font-size:1.3rem;width:100%}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));inset-inline:12px;display:flex;justify-content:space-between;pointer-events:none;font-family:'Lalezar','Cairo',sans-serif;font-size:1.7rem;color:#fff;text-shadow:0 2px 4px #000}
#msg{position:absolute;top:30%;width:100%;text-align:center;font-family:'Lalezar','Cairo',sans-serif;font-size:4.5rem;color:#fff;text-shadow:0 3px 8px #000;pointer-events:none}
#tc{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));inset-inline:10px;display:none;justify-content:space-between}
#tc button{width:88px;height:88px;font-size:2rem;touch-action:none;background:rgba(255,246,224,.8);color:#3b2a1a;border-color:#3b2a1a}
ol{padding-inline-start:24px}
small{opacity:.8}
.hide{display:none!important}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:10px}
#title{justify-content:center}#pick,#setup{justify-content:flex-end}
.logo{font-family:'Lalezar',sans-serif;font-size:clamp(3.6rem,16vw,10rem);line-height:1;margin:0;letter-spacing:.04em;background:linear-gradient(#fff3b0,#f2c230 55%,#c7801a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #7a3f0c) drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.play{margin-top:22px;font-family:'Lalezar',sans-serif;font-size:2.6rem;letter-spacing:.12em;padding:6px 64px;border:none;border-radius:60px;background:linear-gradient(#ff6a4a,#d9412b);color:#fff;box-shadow:0 8px 0 #8d2414,0 16px 24px rgba(0,0,0,.4);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
h2{font-family:'Lalezar','Cairo',sans-serif;margin:0 0 4px;font-size:1.6rem}

.ac{width:calc((100% - 32px)/5);max-width:108px;aspect-ratio:260/535;padding:0;border-radius:14px;background-size:cover;background-position:center;background-repeat:no-repeat}
.ac.on{background-size:cover;background-position:center;background-repeat:no-repeat;outline:4px solid #d9412b;transform:translateY(-5px);box-shadow:0 8px 16px rgba(0,0,0,.35)}
#c{filter:saturate(1.3) contrast(1.08)}
#vg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(20,10,0,.42))}
#mm{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:10px;width:120px;height:120px;background:rgba(0,0,0,.35);border-radius:14px}
#hud span:empty{display:none}
#hud span{background:rgba(0,0,0,.45);padding:0 14px;border-radius:14px}
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px;background:rgba(0,0,0,.55)}
.ov .card{max-height:94%;overflow:auto;padding:12px}.ov h2{font-size:1.3rem}.ov .row{margin:4px 0}.ov button{padding:4px 10px}
label{display:flex;align-items:center;gap:10px;margin:6px 0;font-weight:700}
input[type=range]{flex:1;width:auto;padding:0;border:0;text-transform:none}
#gear{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;font-size:1.4rem;border-radius:50%;padding:0;background:rgba(255,246,224,.92);z-index:5}
body.race #gear{top:calc(58px + env(safe-area-inset-top,0px))}
#fps{position:absolute;left:10px;bottom:6px;color:#fff;font:700 13px monospace;text-shadow:0 1px 2px #000;pointer-events:none}
#rot{display:none;position:absolute;bottom:120px;width:100%;text-align:center;color:#fff;background:rgba(0,0,0,.55);padding:6px;font-weight:700;pointer-events:none}
@media (orientation:portrait){body.race:not(.rotok) #rot{display:block}}
#spd{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,0) 0 3deg,rgba(255,255,255,.5) 3.4deg 3.9deg,rgba(255,255,255,0) 4.3deg 7.5deg);-webkit-mask:radial-gradient(circle at 50% 55%,transparent 40%,#000 90%);mask:radial-gradient(circle at 50% 55%,transparent 40%,#000 90%)}
#tip{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:100%;text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none;opacity:0;transition:opacity .6s;font-size:1.05rem;padding:0 10px;box-sizing:border-box}
#tc{direction:ltr}
body.touch.race #tc{display:flex}
#tc #bl,#tc #br{width:min(30vw,190px);height:min(28vh,120px);opacity:.6;border-radius:18px}

   hc.on('data',d=>{if(d.t=='s'){Object.keys(pres).forEach(k=>{if(k!==myId&&!(k in d.s))delete pres[k]});Object.keys(d.s).forEach(k=>{if(k!==myId)pres[k]=d.s[k]});emitP()}else if(d.t=='e')fire(d)});
   hc.on('close',()=>{if(ok&&!done){done=true;leaveRoom();leaveRace(null);show('room');rmsg('صاحب الغرفة خرج من اللعبة.')}})}});
 if(host)peer.on('connection',c=>{conns.set(c.peer,c);
  c.on('open',()=>{pres[c.peer]=pres[c.peer]||{};emitP();bcast(true)});
  c.on('data',d=>{if(d.t=='p'&&d.p&&typeof d.p=='object'){pres[c.peer]=Object.assign(pres[c.peer]||{},d.p);emitP();bcast()}else if(d.t=='e'){fire(d);fan(d,c.peer)}});
  c.on('close',()=>{conns.delete(c.peer);delete pres[c.peer];emitP();bcast(true)})})})}
function showTip(){return;const t=$('tip');t.textContent='🍀 برسيم = سرعة فورية من الصندوق   🛡️ حماية / 🚀 صاروخ / 🪨 / 🐏 = دوس مسافة أو زر 🎁 وقت ما تحب';t.style.opacity=1;setTimeout(()=>t.style.opacity=0,8000)}

const SET=Object.assign({master:.8,music:.5,sfx:.8,quality:(window.matchMedia&&matchMedia('(pointer:coarse)').matches)?'med':'high',cam:1,mm:true,vib:true,fps:false,hud:false},(()=>{try{return JSON.parse(localStorage.getItem('goatset')||'{}')}catch(e){return{}}})());
function saveSet(){try{localStorage.setItem('goatset',JSON.stringify(SET))}catch(e){}}
function applyVol(){if(!ac.a)return;ac.mg.gain.value=SET.master;ac.sg.gain.value=SET.sfx;ac.ug.gain.value=SET.music*.6}
function applyQuality(){const q=SET.quality;window.GQ=q;R.setPixelRatio(q=='high'?Math.min(devicePixelRatio,2):q=='med'?Math.min(devicePixelRatio,1.25):1);
 const sh=q!='low';if(R.shadowMap.enabled!==sh){R.shadowMap.enabled=sh;S.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true)})}sun.castShadow=sh;
 const sz=q=='high'?2048:1024;if(sun.shadow.mapSize.x!==sz){sun.shadow.mapSize.set(sz,sz);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
 sun.shadow.bias=-.0006;sun.shadow.normalBias=.4;S.fog.near=q=='low'?80:150;S.fog.far=q=='low'?520:900;
 const fx=q=='high'&&window.COMP0;window.COMP=fx?window.COMP0:null;R.toneMapping=fx?THREE.NoToneMapping:THREE.ACESFilmicToneMapping;$('c').style.filter=fx?'none':'saturate(1.3) contrast(1.08)';$('vg').style.display=fx?'none':'';rs()}
let MUS=null,musStep=0,musFast=false;
function musicStop(){if(MUS){clearInterval(MUS);MUS=null}}
function musicStart(fast){musicStop();musFast=!!fast;if(SET.music<=0)return;try{ac()}catch(e){return}MUS=setInterval(musicTick,60000/(fast?156:128)/4)}
function musicTick(){try{const a=ac(),t=a.currentTime,n=musStep++,bar=(n>>4)&3,st2=n&15,B=[55,55,65.4,49][bar],k=musFast?1.26:1;
 const note=(f,d,ty,v)=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.ug);o.start(t);o.stop(t+d)};
 if(st2%4==0){const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(ac.ug);o.start(t);o.stop(t+.15)}
 if(st2%4==2)note(7000,.03,'triangle',.12);
 if(st2%2==0)note(B*(st2%4==2?2:1),.18,'sawtooth',.2);
 note(B*4*k*[1,1.5,1.2,1.5,2,1.5,1.2,1.5][st2&7],.1,'square',.05)}catch(e){}}
document.addEventListener('touchstart',()=>{if(ac.a&&ac.a.state=='suspended')ac.a.resume()},{passive:true});
const SL=[['s_master','master'],['s_music','music'],['s_sfx','sfx']];
SL.forEach(([id,k])=>{$(id).oninput=e=>{SET[k]=+e.target.value;applyVol();if(k=='music'){if(SET.music>0&&!MUS)musicStart(false);if(SET.music<=0)musicStop()}}});
function optRow(id,list,key,fn){const r=$(id);list.forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.v=String(v);b.onclick=()=>{SET[key]=v;if(fn)fn();syncSet()};r.appendChild(b)})}
optRow('s_q',[['low','منخفضة'],['med','متوسطة'],['high','عالية']],'quality',applyQuality);optRow('s_cam',[[.8,'قريبة'],[1,'عادية'],[1.3,'بعيدة']],'cam');
function syncSet(){[['s_q','quality'],['s_cam','cam']].forEach(([id,k])=>[...$(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v==String(SET[k]))));
 $('s_mm').textContent='الخريطة: '+(SET.mm?'شغالة':'مقفولة');$('s_vib').textContent='الاهتزاز: '+(SET.vib?'شغال':'مقفول');$('s_fps').textContent='عداد FPS: '+(SET.fps?'شغال':'مقفول');$('s_hud').textContent='كلام السباق: '+(SET.hud?'ظاهر':'مخفي');SL.forEach(([id,k])=>$(id).value=SET[k])}
$('s_mm').onclick=()=>{SET.mm=!SET.mm;syncSet()};$('s_vib').onclick=()=>{SET.vib=!SET.vib;syncSet()};$('s_fps').onclick=()=>{SET.fps=!SET.fps;syncSet()};$('s_hud').onclick=()=>{SET.hud=!SET.hud;syncSet()};
function openSet(){const racing=st=='race'||st=='count'||st=='done';$('set').classList.remove('hide');$('s_race').classList.toggle('hide',!racing);$('s_restart').classList.toggle('hide',MP);$('s_close').classList.toggle('hide',racing);PAUSED=(st=='race'||st=='count')&&!MP;syncSet()}
function closeSet(){$('set').classList.add('hide');PAUSED=false;saveSet()}
function toggleSet(){$('set').classList.contains('hide')?openSet():closeSet()}
$('gear').onclick=toggleSet;$('s_close').onclick=closeSet;$('s_resume').onclick=closeSet;
$('s_restart').onclick=()=>{closeSet();leaveRace(null);begin()};

async function leaveRoom(){const r=ROOM;ROOM=null;MP=false;isHost=false;$('plist').classList.add('hide');try{if(r)await r.leave()}catch(e){}}
$('rback').onclick=()=>show('title');$('pback').onclick=()=>{if(MP)leaveRoom();show('room')};$('home').onclick=()=>{if(MP)leaveRoom();leaveRace('title')};
// ---- real goat sound from a file (kept on this device)
let GSND=null,GRAW=null,GDEC=0;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('thegoat',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbDel(k){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').delete(k)}catch(e){}}
function decodeGoat(){if(!GRAW||GSND||GDEC)return;GDEC=1;try{ac().decodeAudioData(GRAW.slice(0),b=>{GSND=b;GDEC=0;syncSnd()},()=>{GDEC=0;GRAW=null;syncSnd()})}catch(e){GDEC=0}}
function syncSnd(){$('s_sndt').textContent=GRAW?'✅ صوت ماعز حقيقي شغال':'الصوت دلوقتي مصنوع بالكمبيوتر. حمّل مقطع مأمأة ماعز (مثلاً من BigSoundBank) واختاره من هنا.';$('s_sndx').classList.toggle('hide',!GRAW)}
$('s_snd').onclick=()=>$('s_file').click();
$('s_file').onchange=async e=>{const f=e.target.files[0];if(!f)return;GRAW=await f.arrayBuffer();GSND=null;GDEC=0;await idbSet('goatsnd',GRAW);decodeGoat();syncSnd();setTimeout(()=>baa(1,1,.7),700)};
$('s_sndx').onclick=()=>{GRAW=null;GSND=null;idbDel('goatsnd');syncSnd()};
idbGet('goatsnd').then(b=>{if(b){GRAW=b;syncSnd()}});syncSnd();
function initFX(){try{if(!THREE.EffectComposer||!THREE.UnrealBloomPass||!THREE.ShaderPass||!THREE.RenderPass||!R.capabilities.isWebGL2)return;
 const rt=new THREE.WebGLMultisampleRenderTarget(innerWidth,innerHeight,{format:THREE.RGBAFormat,type:(R.extensions.has('EXT_color_buffer_float')||R.extensions.has('EXT_color_buffer_half_float'))?THREE.HalfFloatType:THREE.UnsignedByteType});
 const cp=new THREE.EffectComposer(R,rt);cp.addPass(new THREE.RenderPass(S,cam));cp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.3,.6,.92));
 cp.addPass(new THREE.ShaderPass({uniforms:{tDiffuse:{value:null}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;c=aces(c*.9);float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.25);c=(c-.5)*1.05+.5;vec2 d=vUv-.5;c*=1.-dot(d,d)*.6;gl_FragColor=vec4(c,1.);}'}));
 window.COMP0=cp}catch(e){window.COMP0=null}}
initFX();applyQuality();
cam.position.set(0,3.2,8);$('ld').style.display='none';window.READY=1;if(window.__playQ)$('play').click();requestAnimationFrame(loop);
